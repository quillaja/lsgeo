[package]
name = "lsgeo"
version = "0.1.0"
edition = "2024"
description = "Find geospatial vector formats and list layer and field information."

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap-themes = "0.1.3"
colored = "3.1.1"
gdal = "0.19.0"
glob = "0.3.4"
openssl = "0.10.81"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[build-dependencies]
vcpkg = "0.2.15"

